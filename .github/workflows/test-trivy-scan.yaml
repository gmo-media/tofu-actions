# TEMPORARY: verification workflow for the severity gate fail-open fix.
# Remove this file (and test-fixtures/*) before merging the feature PR.
name: Test trivy scan (temporary)

on:
  pull_request:
    paths:
      - 'trivy-scan/**'
      - 'plan-comment/**'
      - '.github/workflows/quickstart-ci.yaml'
      - 'test-fixtures/**'
      - '.github/workflows/test-trivy-scan.yaml'

permissions:
  contents: read

jobs:
  # Should fail normally: well-formed severity list, real HIGH findings present.
  trivy-normal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./trivy-scan
        with:
          dir: test-fixtures/vulnerable-tf
          severity: 'CRITICAL,HIGH'

  # Should fail too: whitespace/case variants must not silently disable the gate.
  trivy-messy-severity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./trivy-scan
        with:
          dir: test-fixtures/vulnerable-tf
          severity: 'critical, high'

  # Should fail loudly with an explicit "unknown severity token" error, not silently pass.
  trivy-typo-severity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./trivy-scan
        with:
          dir: test-fixtures/vulnerable-tf
          severity: 'CRIT'

  # Should pass: report-only default still works after the fix.
  trivy-report-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./trivy-scan
        with:
          dir: test-fixtures/vulnerable-tf
          severity: ''
