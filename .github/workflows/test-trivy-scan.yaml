# TEMPORARY: verification workflow for the report-only (empty severity) default.
# Remove this file (and test-fixtures/*) before merging the feature PR.
name: Test trivy scan (temporary)

on:
  pull_request:
    paths:
      - 'trivy-scan/**'
      - 'plan-comment/**'
      - '.github/workflows/quickstart-ci.yaml'
      - 'test-fixtures/**'
      - '.github/workflows/test-trivy-scan.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  trivy-report-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./trivy-scan
        with:
          dir: test-fixtures/vulnerable-tf
          # Mirrors quickstart-ci.yaml's new default for trivy_severity.
          severity: ''

  plan-comment:
    needs: [ trivy-report-only ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./plan-comment
        with:
          force-fail: ${{ contains(needs.*.result, 'failure') }}
