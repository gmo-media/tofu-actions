# Plan and apply on pull requests
name: CI

on:
  workflow_call:
    inputs:
      trivy_severity:
        description: >-
          Comma separated list of severities that fail the Trivy scan.
          Default is empty (report-only: findings are shown in the PR comment but never fail the check).
          Set to e.g. CRITICAL,HIGH to enforce a gate.
          Note: this report-only default is for the v5 rollout only. A future major release (v6)
          is planned to make CRITICAL,HIGH the default and enforce blocking; repos that want to
          opt in early can already set this input explicitly.
        type: string
        default: ''
        required: false
      trivy_trivyignores:
        description: >-
          Comma separated list of additional .trivyignore file paths, relative to
          this repository, to merge with the org-wide default ignores (see
          gmo-media/tofu-actions trivy-scan action). A .trivyignore at this
          repository's root is auto-detected and merged in even without setting
          this input; use this only for extra files elsewhere. The org-wide
          defaults always apply regardless; nothing here can replace them.
        type: string
        default: ''
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  pull-requests: write
  id-token: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - id: prepare
        uses: gmo-media/tofu-actions/prepare@v5
    outputs:
      strategy: ${{ steps.prepare.outputs.strategy }}
      merged-pr-number: ${{ steps.prepare.outputs.merged-pr-number }}
      merged-pr-run-id: ${{ steps.prepare.outputs.merged-pr-run-id }}

  plan:
    needs: [ prepare ]
    name: Plan (${{ matrix.dir }})
    if: ${{ github.event_name == 'pull_request' && needs.prepare.outputs.strategy != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.strategy) }}
    runs-on: ubuntu-latest
    steps:
      - uses: gmo-media/tofu-actions/configure@v5
        with:
          dir: ${{ matrix.dir }}

      - uses: gmo-media/tofu-actions/plan@v5
        with:
          dir: ${{ matrix.dir }}

  trivy:
    needs: [ prepare ]
    name: Trivy scan (${{ matrix.dir }})
    if: ${{ github.event_name == 'pull_request' && needs.prepare.outputs.strategy != '[]' }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.strategy) }}
    runs-on: ubuntu-latest
    steps:
      - uses: gmo-media/tofu-actions/trivy-scan@v5
        with:
          dir: ${{ matrix.dir }}
          severity: ${{ inputs.trivy_severity }}
          trivyignores: ${{ inputs.trivy_trivyignores }}

  plan-comment:
    needs: [ prepare, plan, trivy ]
    if: ${{ always() && github.event_name == 'pull_request' }}
    name: Plan comment
    runs-on: ubuntu-latest
    steps:
      - uses: gmo-media/tofu-actions/plan-comment@v5
        with:
          force-fail: ${{ contains(needs.*.result, 'failure') }} # Make this job fail if dependencies failed

  apply:
    needs: [ prepare ]
    name: Apply (${{ matrix.dir }})
    if: ${{ github.event_name == 'push' && needs.prepare.outputs.strategy != '[]' && needs.prepare.outputs.merged-pr-number != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.strategy) }}
    runs-on: ubuntu-latest
    steps:
      - if: ${{ needs.prepare.outputs.merged-pr-run-id == '' }}
        name: Fail if no plan found
        run: echo "We wanted to auto-apply a plan generated in PR, but we could not find one. Perhaps the PR workflow failed?" && exit 1

      - uses: gmo-media/tofu-actions/configure@v5
        with:
          dir: ${{ matrix.dir }}
          mode: apply

      - uses: gmo-media/tofu-actions/apply@v5
        with:
          dir: ${{ matrix.dir }}
          run-id: ${{ needs.prepare.outputs.merged-pr-run-id }}
