name: Plan comment
description: Composites plan outputs from artifacts and posts them as a pull request comment.

inputs:
  apply_workflow_id:
    description: Workflow ID (filename) to apply plans
    default: apply.yaml
  force-fail:
    description: >-
      If true, this step will fail.
      Useful for combining with GitHub branch ruleset enforcing status checks, since "skipped" job counts as success.
    default: 'false'

runs:
  using: composite
  steps:
    - name: Download plan texts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: plan-text-*
        path: /tmp/
        merge-multiple: true

    - name: Download trivy texts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: trivy-text-*
        path: /tmp/
        merge-multiple: true

    - name: Download trivy summaries
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        pattern: trivy-summary-*
        path: /tmp/
        merge-multiple: true

    - id: composite
      name: Composite plan and trivy texts
      shell: bash
      run: |
        # ---- Plan section: posted as its own PR comment (message-id: plan-<PR#>) ----
        echo "## Plan" > /tmp/pr-comment-plan.txt

        if ls -d -- /tmp/plan-*.txt >/dev/null 2>&1; then
          found=true
        else
          found=false
        fi

        if [ "$found" = true ]; then
          echo 'These plans will be automatically applied upon merging this PR.' >> /tmp/pr-comment-plan.txt
          echo '' >> /tmp/pr-comment-plan.txt
          echo 'To manually apply these plans, visit' >> /tmp/pr-comment-plan.txt
          echo '${{ github.server_url }}/${{ github.repository }}/actions/workflows/${{ inputs.apply_workflow_id }}' >> /tmp/pr-comment-plan.txt
          echo 'and fill `${{ github.run_id }}` to run_id parameter.' >> /tmp/pr-comment-plan.txt
        fi

        while IFS= read -r -d '' file; do
          dir_name="${file#/tmp/plan-}"
          dir_name="${dir_name%.txt}"
          dir_name="${dir_name//___/\/}"

          echo "### $dir_name" >> /tmp/pr-comment-plan.txt
          echo '```' >> /tmp/pr-comment-plan.txt
          cat $file >> /tmp/pr-comment-plan.txt
          echo '```' >> /tmp/pr-comment-plan.txt
        done < <(find /tmp -maxdepth 1 -name 'plan-*.txt' -print0 | sort -z)

        if [ "$found" = false ]; then
          echo 'No plan output found. If plans are failing, check their logs.' >> /tmp/pr-comment-plan.txt
        fi

        echo 'plan-comment<<EOF' >> $GITHUB_OUTPUT
        cat /tmp/pr-comment-plan.txt >> $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT
        PLAN_LENGTH=$(wc -c /tmp/pr-comment-plan.txt | awk '{print $1}')
        echo "plan-length=$PLAN_LENGTH" >> $GITHUB_OUTPUT

        # ---- Trivy section: posted as its own PR comment (message-id: trivy-<PR#>) ----
        # Kept separate from Plan so that a large Trivy result (many findings) never pushes
        # the Plan comment itself into the "too long" fallback.
        echo '## Security scan (Trivy)' > /tmp/pr-comment-trivy.txt

        if find /tmp -maxdepth 1 -name 'trivy-*.txt' ! -name 'trivy-summary-*' -print -quit 2>/dev/null | grep -q .; then
          trivy_found=true
        else
          trivy_found=false
        fi

        if [ "$trivy_found" = true ] && ls -d -- /tmp/trivy-summary-*.txt >/dev/null 2>&1; then
          echo '' >> /tmp/pr-comment-trivy.txt
          echo '| Directory | Critical | High | Medium | Low | Status |' >> /tmp/pr-comment-trivy.txt
          echo '|---|---|---|---|---|---|' >> /tmp/pr-comment-trivy.txt

          while IFS='|' read -r dir critical high medium low total status; do
            if [ "$status" = "fail" ]; then
              badge='🚨 Fail'
            else
              badge='✅ Pass'
            fi
            echo "| $dir | $critical | $high | $medium | $low | $badge |" >> /tmp/pr-comment-trivy.txt
          done < <(find /tmp -maxdepth 1 -name 'trivy-summary-*.txt' -print0 | sort -z | xargs -0 cat)
        fi

        while IFS= read -r -d '' file; do
          dir_name="${file#/tmp/trivy-}"
          dir_name="${dir_name%.txt}"
          dir_name="${dir_name//___/\/}"

          summary_line=$(awk -F'|' -v d="$dir_name" '$1==d {print; exit}' /tmp/trivy-summary-*.txt 2>/dev/null)
          if [ -n "$summary_line" ]; then
            IFS='|' read -r _ critical high medium low total status <<< "$summary_line"
            label="$dir_name — ${total} issues (Critical: $critical, High: $high, Medium: $medium, Low: $low)"
          else
            label="$dir_name"
          fi

          # $file contains pre-formatted nested <details> markdown (file > resource), not plain text,
          # so it is embedded directly rather than wrapped in a code fence.
          echo '' >> /tmp/pr-comment-trivy.txt
          echo '<details>' >> /tmp/pr-comment-trivy.txt
          echo "<summary>$label</summary>" >> /tmp/pr-comment-trivy.txt
          echo '' >> /tmp/pr-comment-trivy.txt
          cat $file >> /tmp/pr-comment-trivy.txt
          echo '' >> /tmp/pr-comment-trivy.txt
          echo '</details>' >> /tmp/pr-comment-trivy.txt
        done < <(find /tmp -maxdepth 1 -name 'trivy-*.txt' ! -name 'trivy-summary-*' -print0 | sort -z)

        if [ "$trivy_found" = false ]; then
          echo '' >> /tmp/pr-comment-trivy.txt
          echo 'No Trivy scan output found. If the scan is failing, check its logs.' >> /tmp/pr-comment-trivy.txt
        else
          echo '' >> /tmp/pr-comment-trivy.txt
          echo 'To suppress a specific finding, see [Filtering resources by inline comments](https://trivy.dev/latest/docs/scanner/misconfiguration/config/config/#filtering-resources-by-inline-comments) (e.g. `#trivy:ignore:<ID>`).' >> /tmp/pr-comment-trivy.txt
        fi

        echo 'trivy-comment<<EOF' >> $GITHUB_OUTPUT
        cat /tmp/pr-comment-trivy.txt >> $GITHUB_OUTPUT
        echo 'EOF' >> $GITHUB_OUTPUT
        TRIVY_LENGTH=$(wc -c /tmp/pr-comment-trivy.txt | awk '{print $1}')
        echo "trivy-length=$TRIVY_LENGTH" >> $GITHUB_OUTPUT

    - if: ${{ steps.composite.outputs.plan-length > 50000 }}
      name: Add plan comment (too long)
      uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
      with:
        message-id: plan-${{ github.event.pull_request.number }}
        message-failure: Plan was not successful
        message: |
          ## Plan

          Plan results were too long (> 50k chars) to include in PR comment.
          Please check actions summary for more info.
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          These plans will be automatically applied upon merging this PR.

          To manually apply these plans, visit
          ${{ github.server_url }}/${{ github.repository }}/actions/workflows/${{ inputs.apply_workflow_id }}
          and fill `${{ github.run_id }}` to run_id parameter.

    - if: ${{ steps.composite.outputs.plan-length <= 50000 }}
      name: Add plan comment
      uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
      with:
        message-id: plan-${{ github.event.pull_request.number }}
        message-failure: Plan was not successful
        message: ${{ steps.composite.outputs.plan-comment }}

    - if: ${{ steps.composite.outputs.trivy-length > 50000 }}
      name: Add trivy comment (too long)
      uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
      with:
        message-id: trivy-${{ github.event.pull_request.number }}
        message-failure: Trivy scan was not successful
        message: |
          ## Security scan (Trivy)

          Trivy scan results were too long (> 50k chars) to include in PR comment.
          Please check actions summary for more info.
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - if: ${{ steps.composite.outputs.trivy-length <= 50000 }}
      name: Add trivy comment
      uses: mshick/add-pr-comment@b8f338c590a895d50bcbfa6c5859251edc8952fc # v2.8.2
      with:
        message-id: trivy-${{ github.event.pull_request.number }}
        message-failure: Trivy scan was not successful
        message: ${{ steps.composite.outputs.trivy-comment }}

    - if: ${{ inputs.force-fail == 'true' }}
      name: Force fail
      shell: bash
      run: echo "Force-fail input is true, so I'm making this step fail. Perhaps some plans have failed?" && exit 1
